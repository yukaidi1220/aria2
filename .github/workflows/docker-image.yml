name: docker image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.dockerignore'
      - '.github/workflows/docker-image.yml'
      - 'src/**'
      - 'configure.ac'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aria2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-${GITHUB_SHA::7}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect "$IMAGE:latest"

  smoke:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run image and exercise the RPC
        run: |
          set -e
          docker run -d --name aria2-smoke -e RPC_SECRET=ci-secret -p 127.0.0.1:6800:6800 "$IMAGE:latest"

          rpc() { curl -fsS http://127.0.0.1:6800/jsonrpc -d "$1"; }

          # wait for RPC to come up with the valid secret
          for i in $(seq 1 30); do
            if rpc '{"jsonrpc":"2.0","id":1,"method":"aria2.getVersion","params":["token:ci-secret"]}' | grep -q '"version"'; then
              echo "RPC is up"
              break
            fi
            sleep 1
          done
          rpc '{"jsonrpc":"2.0","id":1,"method":"aria2.getVersion","params":["token:ci-secret"]}' | grep -q '"version"'

          # a wrong secret must be rejected
          rpc '{"jsonrpc":"2.0","id":1,"method":"aria2.getVersion","params":["token:wrong"]}' | grep -q '"error"'

          # download a real file through the RPC into /downloads
          rpc '{"jsonrpc":"2.0","id":1,"method":"aria2.addUri","params":["token:ci-secret",["https://raw.githubusercontent.com/yukaidi1220/aria2/main/README"],{"dir":"/downloads"}]}' | grep -q '"result"'

          for i in $(seq 1 60); do
            if docker exec aria2-smoke test -f /downloads/README; then
              echo "download completed:"
              docker exec aria2-smoke ls -la /downloads/
              exit 0
            fi
            sleep 1
          done

          echo "download did not complete in time"
          docker logs aria2-smoke
          exit 1
